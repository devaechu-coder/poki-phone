name: 코블몬 API 살펴보기 (임시)
on:
  push:
    paths: [".github/workflows/inspect-cobblemon.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: |
          for p in client/gui/PokemonGuiUtils.kt client/gui/interact/partyselect/PartySlotButton.kt; do
            for ref in 1.7.3 main; do
              if curl -fsSL "https://gitlab.com/cable-mc/cobblemon/-/raw/$ref/common/src/main/kotlin/com/cobblemon/mod/common/$p" -o f.kt; then echo "=== $p @ $ref"; cat f.kt; break; fi
            done
          done
